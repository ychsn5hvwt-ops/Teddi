<style>
  :root {
    --bg: #fbf6f1;
    --card: #ffffff;
    --ink: #2b2220;
    --muted: #8a7a74;
    --accent: #c8553d;
    --accent-soft: #f6e3dc;
    --line: #eadfd8;
    --done: #7a9e7e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    text-align: center;
    padding: 56px 20px 24px;
  }
  header h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); }
  .logo { width: 104px; height: 104px; display: block; margin: 0 auto 14px; filter: drop-shadow(0 6px 14px rgba(43,34,32,.12)); transition: transform .3s ease; }
  .logo:hover { transform: scale(1.06); }

  nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 20px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  nav button, .chip, .surprise {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
  }
  nav button:hover, .chip:hover { border-color: var(--accent); }
  nav button.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  main { max-width: 1040px; margin: 0 auto; padding: 16px 20px 80px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 0 20px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 14px; font-size: .88rem; }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .surprise {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .surprise:hover { filter: brightness(1.05); }

  .progress { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(43,34,32,.06); }
  .card.highlight { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card.is-done { opacity: .6; }
  .card.is-done h3 { text-decoration: line-through; text-decoration-color: var(--done); }
  .card .emoji { font-size: 1.8rem; line-height: 1; }
  .card h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.2rem;
    margin: 4px 0 0;
  }
  .card p { margin: 0; color: #5a4c47; font-size: .95rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    font-size: .75rem;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 2px 10px;
    border-radius: 999px;
    color: var(--muted);
  }
  .card label {
    margin-top: auto;
    padding-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .88rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .card input[type="checkbox"] { accent-color: var(--done); width: 16px; height: 16px; }
  .card a { color: var(--accent); font-size: .9rem; }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; grid-column: 1 / -1; }


  .open-list {
    font: inherit;
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .open-list:hover { background: var(--accent); color: #fff; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(43,34,32,.45);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--bg);
    border-radius: 20px;
    width: 100%; max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px 24px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; }
  .panel h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0; font-size: 1.7rem; }
  .close {
    font: inherit; font-size: 1.6rem; line-height: 1;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  .panel .progress { margin: 6px 0 4px; }
  .group {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 1.15rem;
    margin: 22px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  ul.sub { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.sub li {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  ul.sub li label { padding-top: 3px; cursor: pointer; }
  ul.sub li input { accent-color: var(--done); width: 16px; height: 16px; }
  ul.sub li p { margin: 2px 0 4px; color: #5a4c47; font-size: .9rem; }
  ul.sub li a { color: var(--accent); font-size: .85rem; }
  ul.sub li.is-done { opacity: .6; }
  ul.sub li.is-done strong { text-decoration: line-through; text-decoration-color: var(--done); }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 20px 40px; }
</style>
</head>

<footer>Made for two. ♥</footer>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

/* =========================================================
   You don't need to edit anything below this line.
   ========================================================= */

const STORAGE_KEY = "our-little-list-done";
let done = {};
try { done = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { done = {}; }
function saveDone() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); } catch (e) {}
}

let currentSection = "dates";
let currentTag = "all";

const tabsEl = document.getElementById("tabs");
const chipsEl = document.getElementById("chips");
const gridEl = document.getElementById("grid");
const progressEl = document.getElementById("progress");

function idFor(section, item) { return section + "::" + item.title; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.entries(SECTIONS).forEach(([key, sec]) => {
    const b = document.createElement("button");
    b.textContent = sec.label;
    if (key === currentSection) b.classList.add("active");
    b.onclick = () => { currentSection = key; currentTag = "all"; render(); };
    tabsEl.appendChild(b);
  });
}

function renderChips() {
  const sec = SECTIONS[currentSection];
  const items = sec.items;
  const tags = sec.categories || [...new Set(items.flatMap(i => i.tags || []))];
  chipsEl.innerHTML = "";
  ["all", ...tags].forEach(t => {
    const c = document.createElement("button");
    c.className = "chip" + (t === currentTag ? " active" : "");
    const n = sec.categories && t !== "all" ? items.filter(i => i.category === t).length : 0;
    c.textContent = t === "all" ? "All" : (sec.categories ? `${t}${n ? " · " + n : ""}` : t);
    c.onclick = () => { currentTag = t; render(); };
    chipsEl.appendChild(c);
  });
}

function visibleItems() {
  const sec = SECTIONS[currentSection];
  const items = sec.items;
  if (currentTag === "all") return items;
  return sec.categories ? items.filter(i => i.category === currentTag) : items.filter(i => (i.tags || []).includes(currentTag));
}

function renderGrid(highlightTitle) {
  const items = visibleItems();
  gridEl.innerHTML = "";
  if (!items.length) {
    gridEl.innerHTML = `<div class="empty">No ${currentTag === "all" ? "" : escapeHtml(currentTag) + " "}places yet — add your favourites!</div>`;
    return;
  }
  items.forEach(item => {
    const id = idFor(currentSection, item);
    const isDone = !!done[id];
    const card = document.createElement("div");
    card.className = "card" + (isDone ? " is-done" : "") + (item.title === highlightTitle ? " highlight" : "");
    const doneLabel = currentSection === "travel" ? "Been there" : currentSection === "restaurants" ? "Tried it" : "Done it";
    card.innerHTML = `
      <div class="emoji">${escapeHtml(item.emoji || "💛")}</div>
      <h3>${escapeHtml(item.title)}</h3>
      <p>${escapeHtml(item.text || "")}</p>
      <div class="meta">${[item.category, ...(item.tags || [])].filter(Boolean).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      ${item.link ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">Open link →</a>` : (item.category ? `<a href="${mapsLink(item.title, (item.tags || [])[0])}" target="_blank" rel="noopener">Map →</a>` : "")}
      ${item.opens && SUBLISTS[item.opens] ? `<button class="open-list">See the list →</button>` : ""}
      <label><input type="checkbox" ${isDone ? "checked" : ""}> ${doneLabel}</label>
    `;
    const openBtn = card.querySelector(".open-list");
    if (openBtn) openBtn.onclick = () => openSublist(item.opens);
    card.querySelector("input").onchange = e => {
      if (e.target.checked) done[id] = true; else delete done[id];
      saveDone();
      render();
    };
    gridEl.appendChild(card);
    if (item.title === highlightTitle) card.scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

function renderProgress() {
  const items = SECTIONS[currentSection].items;
  const count = items.filter(i => done[idFor(currentSection, i)]).length;
  progressEl.textContent = `${count} of ${items.length} ticked off`;
}

function render(highlightTitle) {
  renderTabs();
  renderChips();
  renderProgress();
  renderGrid(highlightTitle);
}

document.getElementById("surprise").onclick = () => {
  const pool = visibleItems().filter(i => !done[idFor(currentSection, i)]);
  const list = pool.length ? pool : visibleItems();
  if (!list.length) return;
  const pick = list[Math.floor(Math.random() * list.length)];
  render(pick.title);
};


/* ---------- Pop-up list (museums) ---------- */
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
let openKey = null;

function mapsLink(name, city) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " " + (city || ""));
}

function openSublist(key) {
  openKey = key;
  const list = SUBLISTS[key];
  const all = list.groups.flatMap(g => g.items);
  const seen = all.filter(i => done["sub::" + key + "::" + i.name]).length;
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${escapeHtml(list.title)}</h2>
      <button class="close" aria-label="Close">×</button>
    </div>
    <div class="progress">${seen} of ${all.length} ${key === "museums" ? "visited" : "been there"}</div>
    ${list.groups.map(g => `
      <h3 class="group">${escapeHtml(g.name)}</h3>
      <ul class="sub">
        ${g.items.map(i => {
          const id = "sub::" + key + "::" + i.name;
          const city = i.city || g.city;
          return `<li class="${done[id] ? "is-done" : ""}">
            <label><input type="checkbox" data-id="${escapeHtml(id)}" ${done[id] ? "checked" : ""}></label>
            <div>
              <strong>${escapeHtml(i.name)}</strong>${i.city ? ` <span class="tag">${escapeHtml(i.city)}</span>` : ""}
              <p>${escapeHtml(i.text || "")}</p>
              <a href="${mapsLink(i.name, city)}" target="_blank" rel="noopener">Map →</a>
            </div>
          </li>`;
        }).join("")}
      </ul>`).join("")}
  `;
  panel.querySelector(".close").onclick = closeSublist;
  panel.querySelectorAll("input[data-id]").forEach(cb => {
    cb.onchange = e => {
      const id = e.target.dataset.id;
      if (e.target.checked) done[id] = true; else delete done[id];
      saveDone();
      const scroll = panel.scrollTop;
      openSublist(key);
      panel.scrollTop = scroll;
    };
  });
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeSublist() {
  overlay.classList.remove("show");
  document.body.style.overflow = "";
  openKey = null;
}
overlay.addEventListener("click", e => { if (e.target === overlay) closeSublist(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openKey) closeSublist(); });

render();
</script>
